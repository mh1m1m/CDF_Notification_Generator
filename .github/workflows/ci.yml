# CI for CDF V13 Enterprise — SYNTHETIC-DATA REFERENCE IMPLEMENTATION, not CDF production.
#
# Jobs: quality (lint, typecheck, format, db:lint) · unit · rehearsal (scripts/db/rehearse-shared.mjs on a local
# PostgreSQL 16 cluster) · integration (two throw-away PostgreSQL 17 containers: the db:reset target, and a hosted
# simulation whose bootstrap superuser is supabase_admin) · build · e2e (Playwright smoke and accessibility). No
# repository secrets are used; the database passwords below exist only inside the job's containers and are
# deliberately not secret.
#
# Actions are pinned to full commit SHAs (tag in the comment). The first run (40626543282, commit 5c53ec4) resolved
# every pin. These versions target Node.js 20, which GitHub now runs on Node.js 24 with a deprecation warning; moving
# to the current majors is OPEN_ISSUES OI-021.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, format, db:lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm db:lint

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Database integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      hosted-sim:
        image: postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      V13_ADMIN_DATABASE_URL: postgres://postgres:ci-only-not-a-secret@127.0.0.1:5432/v13_local
      V13_HOSTED_SIM_SUPERUSER_URL: postgres://supabase_admin:ci-only-not-a-secret@127.0.0.1:5433/postgres
      V13_MIGRATION_RUNNER: ci
      V13_DB_TESTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset
      - run: pnpm test:db
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  rehearsal:
    # V13-DB-006: the scripted rehearsal of the shared-database procedure (ISOLATION_AND_RECOVERY_PLAN §6 step 0) on a
    # throw-away local cluster laid out like the hosted project: dry run, apply, fingerprints, isolation checks, four
    # planted faults, refused and clean rollback. It never connects anywhere else. The runner image ships PostgreSQL
    # 16 binaries (no service is started; the script runs its own cluster in RUNNER_TEMP on port 54339).
    name: Shared-database rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
      - name: Locate PostgreSQL 16 binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16
          fi
          /usr/lib/postgresql/16/bin/initdb --version
          echo "V13_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      # The script uses Node built-ins only, so no dependency install is needed.
      - run: node scripts/db/rehearse-shared.mjs --dir="$RUNNER_TEMP/v13-rehearsal" --port=54339

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: End-to-end smoke (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds and starts the app on port 3100 with a session secret generated for this run (playwright.config.ts).
      - run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
