# The full screenshot library for CDF V13 Enterprise (V13-ARCH-014; REQ-VIS-001, -004, -005, -015;
# docs/qa/M1_OPEN_QA_ROWS_DESIGN.md §2–§4 and §8, ruling D3). SYNTHETIC-DATA REFERENCE IMPLEMENTATION, not CDF production.
#
# Runs the `visual-library` project (about 244 images in ar and en, light and dark, desktop, tablet and mobile, with
# their manifest) on a pull request labelled `visual-library`: when the label is added and on every later push. Its
# own workflow, as cross-browser.yml, so that adding the label starts it without re-running CI. The images are an
# artifact for design reviews and UXQA-05, never baselines: those are compared in ci.yml's `visual` job. The four font
# packages are the visual job's (docs/DEPENDENCIES.md); library-teardown.ts writes their versions into the manifest.
#
# Security (SEC's CI rules): `pull_request`, never `pull_request_target`; `contents: read` and no secrets; no event text
# in any `run:`; the database passwords exist only in the job's container and are deliberately not secret; the
# visual projects record no trace, video or failure screenshot (playwright.config.ts `visualUse`), and the library's
# data check refuses an image with anything outside the synthetic data set before it is written.
name: Visual library

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: visual-library-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  library:
    name: Screenshot library (Playwright)
    if: contains(github.event.pull_request.labels.*.name, 'visual-library')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      V13_ADMIN_DATABASE_URL: postgres://postgres:ci-only-not-a-secret@127.0.0.1:5432/v13_local
      V13_MIGRATION_RUNNER: ci
      # The app login with the local-only password db:reset gives it (scripts/db/reset-local.mjs); loopback only.
      V13_E2E_DATABASE_URL: postgres://cdf_v13_app:local-only-not-a-secret@127.0.0.1:5432/v13_local
      V13_E2E_VISUAL: library
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset
      - name: Install the fonts the baselines are made with
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-liberation fonts-dejavu-core fonts-crosextra-carlito fonts-noto-core
          dpkg-query -W -f='${Package} ${Version}\n' fonts-liberation fonts-dejavu-core fonts-crosextra-carlito fonts-noto-core
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=visual-library
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
